name: Phase 3 geometry and optics validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  octave-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install numerical runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave octave-image octave-statistics
      - name: Complete spatial and preserved Phase 1/2 acceptance
        run: python3 scripts/run_phase3_acceptance.py --expected-commit "$GITHUB_SHA"
      - name: Retain exact-source validation and artifact evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: phase3-evidence-${{ github.sha }}
          path: outputs/phase3-acceptance/
          if-no-files-found: error
          retention-days: 14
