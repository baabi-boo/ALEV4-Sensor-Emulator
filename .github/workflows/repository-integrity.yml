name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  submodule-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
          persist-credentials: false
      - name: Verify pinned upstream Git links
        run: python3 scripts/verify_submodules.py

