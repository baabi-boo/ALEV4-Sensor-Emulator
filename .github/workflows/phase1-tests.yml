name: Phase 1 numerical validation

on:
  push:
    branches: [main, phase1-bayer-baseline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  octave-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install numerical runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends octave octave-image octave-statistics
      - name: Core numerical tests
        run: octave --no-gui --quiet --eval "addpath('matlab'); setup_project(false); report=test_phase1_core(); disp(jsonencode(report));"
      - name: ISETCam integration tests
        run: octave --no-gui --quiet --eval "pkg load image; pkg load statistics; addpath('matlab'); setup_project(true); report=test_iset_integration(); disp(jsonencode(report));"
